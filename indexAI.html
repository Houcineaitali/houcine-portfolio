<div id="chat-window"></div>
<input type="text" id="userInput" placeholder="Ask something...">
<button id="sendBtn" onclick="askAI()" class="askAI" disabled>Send</button>

    <script>
      const inputField = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// كايخلي الزر طافي (disabled) إيلا كان الحقل خاوي
inputField.addEventListener('input', () => {
    sendBtn.disabled = inputField.value.trim() === "";
});

async function askAI() {
    const chatWindow = document.getElementById('chat-window');
    const message = inputField.value.trim();

    if (message === "") return;

    // 1. عرض رسالة المستخدم
const msgDiv = document.createElement('div');
const msgP = document.createElement('p');
msgP.className = 'user-msg';
msgP.textContent = message; // آمنة جداً ضد XSS
msgDiv.appendChild(msgP);
chatWindow.appendChild(msgDiv);    inputField.value = '';
    sendBtn.disabled = true; // تجميد الزر حتى يجي الجواب
    chatWindow.scrollTop = chatWindow.scrollHeight;

    // الرابط المباشر باش نتفاداو مشاكل Brackets
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyB0v2IQr-8g3RMAjResquhB5RWh07en3Zs';

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: "Antworte als Houcine Ait Ali (KI-Assistent). User Frage: " + message }]
                }]
            })
        });

        if (!response.ok) throw new Error('API Error');

        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text;

        // 2. عرض جواب الـ AI
        chatWindow.innerHTML += `<div class="ai-msg"><b>AI:</b> ${aiText}</div>`;
        
    } catch (error) {
        console.error("Details:", error);
        chatWindow.innerHTML += `<div style="color:red" data-i18n="error" >Error: Verbindung fehlgeschlagen.</div>`;
    }

    chatWindow.scrollTop = chatWindow.scrollHeight;
}
    </script>
